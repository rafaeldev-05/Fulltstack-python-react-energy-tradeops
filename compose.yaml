services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/energy_tradeops.db
    volumes:
      - tradeops-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  tradeops-data:
